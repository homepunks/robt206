[package]
name = "robt206"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
ogg = "0.9.2"
opus = "0.3.1"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "query", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
hound = "3.5.1"
